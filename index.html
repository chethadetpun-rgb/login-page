<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    padding:40px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:300px;
}

.login-box h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#4facfe;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2b8cff;
}

#error{
    color:red;
    margin-top:10px;
    display:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>กรอกรหัสผ่าน</h2>

<input type="password" id="password" placeholder="ใส่รหัสผ่าน">

<button onclick="checkPassword()">เข้าสู่ระบบ</button>

<div id="error">❌ รหัสผ่านไม่ถูกต้อง</div>

</div>

<script>

function checkPassword(){

    let pass = document.getElementById("password").value;

    // แยกรหัสผ่าน
    let a = "Oa";
    let b = "c1";
    let c = "23";
    let d = "4";

    let realPass = a + b + c + d;

    if(pass === realPass){
        window.location.href = "https://drive.google.com/drive/folders/1QfeFjoZqEgl-QWtxkDLN3hCTgEnHtraa";
    }else{
        document.getElementById("error").style.display="block";
    }

}

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

document.onkeydown = function(e){

    if(e.keyCode == 123){
        return false;
    }

    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

}

</script>

</body>
</html>
